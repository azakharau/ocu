[package]
name = "ocu-ratatui"
version = "0.1.0"
edition = "2024"
description = "Render Codex usage windows in the terminal"
license = "MIT"
repository = "https://github.com/azakharau/ocu"
homepage = "https://github.com/azakharau/ocu"
readme = "README.md"
keywords = ["codex", "usage", "ratatui", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "ocu"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["clock"] }
chrono-tz = "0.10.4"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
